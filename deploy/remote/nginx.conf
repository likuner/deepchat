# DeepChat 站点配置 —— nginx 动静分离 + HTTPS
# 部署到 /etc/nginx/sites-available/deepchat.conf

# ============ 80 端口：全部重定向到 HTTPS ============
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# ============ 443 端口：HTTPS 主入口 ============
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # 自签名证书（setup.sh / deploy.sh 自动生成）
    ssl_certificate     /etc/nginx/ssl/deepchat.crt;
    ssl_certificate_key /etc/nginx/ssl/deepchat.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 20m;

    # ---------- gzip 压缩 ----------
    gzip on;
    gzip_vary on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/xml application/json
               application/javascript text/javascript application/xml image/svg+xml;

    # 访问日志
    access_log /var/log/nginx/deepchat.access.log;
    error_log  /var/log/nginx/deepchat.error.log;

    # ============ 动态 API：转发到 FastAPI 后端 (uvicorn :8000) ============
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 动态接口不缓存
        add_header Cache-Control "no-store";

        # SSE (text/event-stream) 必须关闭缓冲，保证流式输出即时推送
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ============ 静态资源：nginx 直读磁盘，不再转发 Next.js（动静分离的"静"） ============
    location /_next/static/ {
        alias /opt/deepchat/frontend/.next/static/;
        access_log off;

        # 静态产物带 hash，可放心缓存一年
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ============ 其余请求：SSR 页面转发到 Next.js (:3000) ============
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 60s;

        # SSR 页面动态渲染，不缓存
        add_header Cache-Control "no-cache";
    }
}
